name: Build i915 SR-IOV driver for Unraid

on:
  workflow_dispatch:
    inputs:
      i915_ref:
        description: 'strongtz/i915-sriov-dkms ref to build (tag/branch/SHA), or "latest" = master HEAD (newest patches)'
        required: false
        default: 'latest'
        type: string
      kernel_release:
        description: 'Unraid kernel release to build for (e.g. 6.18.44-Unraid), or "latest" to auto-detect from ich777/unraid_kernel'
        required: false
        default: 'latest'
        type: string
      package_build:
        description: 'Package build number'
        required: false
        default: '1'
        type: string
  schedule:
    # 每天定时检测 strongtz/i915-sriov-dkms 与 ich777/unraid_kernel 两个仓库，
    # 只有当任一仓库发布新版本时才编译；都没更新则跳过。
    - cron: '30 3 * * *'

permissions:
  contents: write

concurrency:
  group: i915-sriov-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      # GCC 15 matches the official Unraid kernel toolchain; the 6.18 kernel
      # requires -fmin-function-alignment (gcc >= 14).
      image: gcc:15.3.0
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git jq kmod \
            libelf-dev make tar xz-utils
          rm -rf /var/lib/apt/lists/*
          gcc --version | head -1
          nproc

      - name: Resolve i915 ref
        id: resolve
        shell: bash
        env:
          I915_REF_INPUT: ${{ inputs.i915_ref }}
        run: |
          set -euo pipefail
          source scripts/package-version.sh
          ref="${I915_REF_INPUT:-latest}"
          if [ "$ref" = "latest" ]; then
            # Track master HEAD, not the last release tag.
            ref="master"
          fi
          # Resolve every ref once, keeping its SHA and date from the same
          # response. Preserve tag names (including v) and branch slashes.
          encoded_ref="$(jq -rn --arg ref "$ref" '$ref | @uri')"
          commit="$(curl -fsSL "https://api.github.com/repos/strongtz/i915-sriov-dkms/commits/${encoded_ref}")"
          sha="$(jq -er '.sha | select(type == "string") | select(test("^[0-9a-f]{40}$"))' <<< "$commit")"
          timestamp="$(jq -er '.commit.committer.date | select(type == "string")' <<< "$commit")"
          cdate="$(snapshot_date_utc "$timestamp")"
          pkg_version="$(normalize_package_version "$cdate")"
          echo "i915_ref=$sha" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "Resolved strongtz ref: $ref -> $sha (snapshot date $pkg_version UTC)"

      - name: Resolve kernel release
        id: resolve_kernel
        shell: bash
        env:
          KERNEL_RELEASE_INPUT: ${{ inputs.kernel_release }}
        run: |
          set -euo pipefail
          kr="${KERNEL_RELEASE_INPUT:-latest}"
          if [ "$kr" = "latest" ]; then
            # fetch the newest ich777 Unraid kernel release tag
            kr="$(curl -fsSL https://api.github.com/repos/ich777/unraid_kernel/releases/latest \
              | jq -r '.tag_name')"
          fi
          echo "kernel_release=$kr" >> "$GITHUB_OUTPUT"
          echo "Resolved Unraid kernel release: $kr"

      - name: Check if this version is already built
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERNEL_RELEASE: ${{ steps.resolve_kernel.outputs.kernel_release }}
          I915_REF: ${{ steps.resolve.outputs.i915_ref }}
          PKG_VERSION: ${{ steps.resolve.outputs.pkg_version }}
        run: |
          set -euo pipefail
          # 手动触发永远编译；只有定时任务才做“有新版本才编译”的判断
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "new_version=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: always build"
            exit 0
          fi
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          rid="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "${api}/tags/${KERNEL_RELEASE}" | jq -r '.id // empty' 2>/dev/null || true)"
          if [ -z "$rid" ]; then
            echo "No release for ${KERNEL_RELEASE} yet -> new driver needed"
            echo "new_version=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Date-based deduplication does not distinguish commits on the same
          # UTC day. Package versions now use YYYY.MM.DD (e.g. 2026.10.02).
          if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "${api}/${rid}/assets?per_page=100" | \
             jq -e --arg new "i915-sriov-${PKG_VERSION}-" \
               'any(.[]; .name | startswith($new))' >/dev/null 2>&1; then
            echo "strongtz snapshot ${PKG_VERSION} @ ${KERNEL_RELEASE} already built; skipping"
            echo "new_version=false" >> "$GITHUB_OUTPUT"
          else
            echo "New driver needed: strongtz ${PKG_VERSION} (${I915_REF}) @ ${KERNEL_RELEASE}"
            echo "new_version=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build i915 SR-IOV package
        if: steps.check.outputs.new_version == 'true'
        shell: bash
        env:
          I915_SRIOV_REF: ${{ steps.resolve.outputs.i915_ref }}
          I915_SRIOV_COMMIT: ${{ steps.resolve.outputs.i915_ref }}
          KERNEL_RELEASE: ${{ steps.resolve_kernel.outputs.kernel_release }}
          TARGET_KERNEL_VERSION: ${{ steps.resolve_kernel.outputs.kernel_release }}
          PACKAGE_VERSION: ${{ steps.resolve.outputs.pkg_version }}
          PACKAGE_BUILD: ${{ inputs.package_build }}
        run: |
          set -euo pipefail
          # TARGET_KERNEL_VERSION is like 6.18.44-Unraid; strip the suffix for the tree dir
          export TARGET_KERNEL_VERSION="${KERNEL_RELEASE%-Unraid}"
          ./scripts/build-i915-sriov.sh

      - name: Publish Release
        if: steps.check.outputs.new_version == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERNEL_RELEASE: ${{ steps.resolve_kernel.outputs.kernel_release }}
          I915_REF: ${{ steps.resolve.outputs.i915_ref }}
          PKG_VERSION: ${{ steps.resolve.outputs.pkg_version }}
        run: |
          set -euo pipefail
          pkg="$(ls out/i915-sriov-*.txz | head -1)"
          pkg_base="$(basename "$pkg")"
          release_tag="${KERNEL_RELEASE}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          # find or create the release for this kernel tag
          rid="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                  "${api}/tags/${release_tag}" | jq -r '.id // empty' 2>/dev/null || true)"
          if [ -z "$rid" ]; then
            rid="$(curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
                   -H "Accept: application/vnd.github+json" \
                   -d "{\"tag_name\":\"${release_tag}\",\"name\":\"i915 SR-IOV for ${release_tag}\",\"body\":\"Auto-built from strongtz/i915-sriov-dkms @ ${I915_REF} (snapshot ${PKG_VERSION}, i915-only)\"}" \
                   "${api}" | jq -r '.id')"
          fi
          # upload (or replace) the package assets via uploads.github.com
          upload_api="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${rid}/assets"
          for f in "$pkg" "$pkg.md5"; do
            base="$(basename "$f")"
            asset_id="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                        "${api}/${rid}/assets?per_page=100" | \
                        jq -r --arg n "$base" '.[] | select(.name == $n) | .id' | head -1)"
            if [ -n "$asset_id" ]; then
              curl -fsSL -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                "${api}/assets/${asset_id}"
            fi
            curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "${upload_api}?name=${base}"
          done
          echo "Published ${pkg_base} to release ${release_tag}"
