name: Build Intel SR-IOV drivers for Unraid

on:
  workflow_dispatch:
    inputs:
      driver:
        description: 'Independent packages: i915 (recommended), xe (experimental), or both'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - i915
          - xe
      package_build:
        description: 'Package build number: auto increments; an explicit number must exceed existing builds'
        required: false
        default: 'auto'
        type: string
  schedule:
    # Compare each driver's effective inputs, local recipe, kernel and compiler.
    - cron: '30 3 * * *'

permissions:
  contents: write

concurrency:
  group: i915-sriov-build
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      i915_ref: ${{ steps.resolve.outputs.i915_ref }}
      pkg_version: ${{ steps.resolve.outputs.pkg_version }}
      source_fingerprints: ${{ steps.fingerprint.outputs.source_fingerprints }}
      drivers: ${{ steps.fingerprint.outputs.drivers }}
      kernel_releases: ${{ steps.resolve_kernel.outputs.kernel_releases }}
    env:
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Resolve i915 ref
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/package-version.sh
          # Always build the newest supported driver line, including master
          # commits made after release 2026.09.16; never select legacy branches.
          ref=master
          # Resolve the commit, tree and date from the same response.
          encoded_ref="$(jq -rn --arg ref "$ref" '$ref | @uri')"
          commit="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/strongtz/i915-sriov-dkms/commits/${encoded_ref}")"
          sha="$(jq -er '.sha | select(type == "string") | select(test("^[0-9a-f]{40}$"))' <<< "$commit")"
          tree="$(jq -er '.commit.tree.sha | select(type == "string") | select(test("^[0-9a-f]{40}$"))' <<< "$commit")"
          timestamp="$(jq -er '.commit.committer.date | select(type == "string")' <<< "$commit")"
          cdate="$(snapshot_date_utc "$timestamp")"
          pkg_version="$(normalize_package_version "$cdate")"
          echo "i915_ref=$sha" >> "$GITHUB_OUTPUT"
          echo "i915_tree=$tree" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "Resolved strongtz ref: $ref -> $sha (snapshot date $pkg_version UTC)"

      - name: Fingerprint Intel sources
        id: fingerprint
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          I915_TREE: ${{ steps.resolve.outputs.i915_tree }}
          DRIVER_INPUT: ${{ inputs.driver }}
        run: |
          set -euo pipefail
          case "${DRIVER_INPUT:-both}" in
            both) drivers='["i915","xe"]' ;;
            i915) drivers='["i915"]' ;;
            xe) drivers='["xe"]' ;;
            *) echo 'Invalid driver selection' >&2; exit 1 ;;
          esac
          fingerprints="$(python3 scripts/ci-build.py source-fingerprints)"
          echo "source_fingerprints=$fingerprints" >> "$GITHUB_OUTPUT"
          echo "drivers=$drivers" >> "$GITHUB_OUTPUT"
          echo "Effective source fingerprints: $fingerprints"

      - name: Resolve kernel release
        id: resolve_kernel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Official download_list catalog -> matching release notes -> kernels.
          # Add ich777's latest archive for advance preparation, not as an OS
          # release channel. All three sources are deduplicated; no fixed floor.
          python3 scripts/resolve-unraid.py

  build:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kernel_release: ${{ fromJSON(needs.resolve.outputs.kernel_releases) }}
        driver: ${{ fromJSON(needs.resolve.outputs.drivers) }}
    name: Build ${{ matrix.driver }} for ${{ matrix.kernel_release }}
    container:
      # Pin the current stable GCC, independently of the kernel's compiler.
      # Newer Unraid kernels require -fmin-function-alignment (gcc >= 14).
      image: gcc:16.2.0
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git jq kmod \
            libelf-dev make python3 tar xz-utils
          rm -rf /var/lib/apt/lists/*
          gcc --version | head -1
          nproc

      - name: Test build tooling
        shell: bash
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s tests -v

      - name: Check if this version is already built
        id: check
        shell: bash
        env:
          DRIVER: ${{ matrix.driver }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERNEL_RELEASE: ${{ matrix.kernel_release }}
          I915_REF: ${{ needs.resolve.outputs.i915_ref }}
          PKG_VERSION: ${{ needs.resolve.outputs.pkg_version }}
          SOURCE_FINGERPRINT: ${{ fromJSON(needs.resolve.outputs.source_fingerprints)[matrix.driver] }}
          PACKAGE_BUILD_INPUT: ${{ inputs.package_build }}
        run: |
          set -euo pipefail
          python3 scripts/ci-build.py plan

      - name: Build Intel SR-IOV package
        if: steps.check.outputs.new_version == 'true'
        shell: bash
        env:
          DRIVER: ${{ matrix.driver }}
          I915_SRIOV_REF: ${{ needs.resolve.outputs.i915_ref }}
          I915_SRIOV_COMMIT: ${{ needs.resolve.outputs.i915_ref }}
          KERNEL_RELEASE: ${{ matrix.kernel_release }}
          PACKAGE_VERSION: ${{ needs.resolve.outputs.pkg_version }}
          PACKAGE_BUILD: ${{ steps.check.outputs.package_build }}
          SOURCE_FINGERPRINT: ${{ fromJSON(needs.resolve.outputs.source_fingerprints)[matrix.driver] }}
          RECIPE_FINGERPRINT: ${{ steps.check.outputs.recipe_fingerprint }}
          BUILD_KEY: ${{ steps.check.outputs.build_key }}
        run: |
          set -euo pipefail
          # TARGET_KERNEL_VERSION is like 6.18.44-Unraid; strip the suffix for the tree dir
          export TARGET_KERNEL_VERSION="${KERNEL_RELEASE%-Unraid}"
          ./scripts/build-intel-sriov.sh

      - name: Publish Release
        if: steps.check.outputs.new_version == 'true'
        shell: bash
        env:
          DRIVER: ${{ matrix.driver }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci-build.py publish
